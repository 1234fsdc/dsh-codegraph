# dsh-codegraph-plugin bundle patch: inserts this package's plugin row into
# the host cordis composition. dsh plugin --profile <name> add picks this up
# via package.json's dsh.bundle.patch; no manual bundle edit is needed.
- insert:
    - id: dsh-codegraph-plugin
      name: dsh-codegraph-plugin
      config:
        autoInit: false
        maxAutoInitFiles: 5000
        initTimeoutMs: 600000
        queryTimeoutMs: 120000
        syncTimeoutMs: 300000
        maxFiles: 8
        guideSearch: true
        resident: true
        maxResidentProjects: 3
        residentStartTimeoutMs: 30000
